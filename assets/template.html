<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BOOK_TITLE}} · 带音频精读</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root {
  --bg: #faf6f0;
  --bg-card: #fffdf8;
  --text: #3d3226;
  --text-light: #7a6b5a;
  --accent: #c47a3a;
  --accent-light: #f5e6d3;
  --highlight: #fff3c4;
  --highlight-active: #ffe066;
  --border: #e8ddd0;
  --shadow: 0 2px 12px rgba(61,50,38,0.08);
  --sidebar-width: 320px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Noto Serif SC', 'Songti SC', serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.9;
  font-size: 16px;
}
.topbar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(250,246,240,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.topbar-title { font-weight: 700; font-size: 17px; }
.topbar-title span { color: var(--accent); }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.toc-btn, .highlight-mode-btn {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px; color: var(--text-light);
  background: none; border: 1px solid var(--border);
  padding: 5px 12px; border-radius: 16px; cursor: pointer; transition: all 0.2s;
}
.toc-btn:hover, .highlight-mode-btn:hover { background: var(--accent-light); color: var(--accent); }
.highlight-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sidebar {
  position: fixed; top: 0; right: -320px;
  width: 300px; height: 100vh;
  background: var(--bg-card);
  border-left: 1px solid var(--border);
  z-index: 200; transition: right 0.3s ease;
  overflow-y: auto; padding: 24px;
}
.sidebar.open { right: 0; }
.sidebar-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.3); z-index: 150; display: none;
}
.sidebar-overlay.show { display: block; }
.sidebar h3 {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px; color: var(--text-light);
  margin-bottom: 16px; letter-spacing: 2px;
}
.sidebar a {
  display: block; padding: 9px 12px;
  color: var(--text); text-decoration: none;
  border-radius: 8px; font-size: 14px;
  margin-bottom: 3px; transition: all 0.2s;
}
.sidebar a:hover { background: var(--accent-light); color: var(--accent); }
.sidebar a .num { color: var(--accent); font-weight: 700; margin-right: 8px; }
.main-layout {
  display: flex; max-width: 1200px;
  margin: 0 auto; gap: 30px; padding: 30px 24px 60px;
}
.content-area { flex: 1; min-width: 0; padding-right: 10px; }
.audio-sidebar {
  width: var(--sidebar-width); flex-shrink: 0;
  position: sticky; top: 70px; align-self: flex-start;
  max-height: calc(100vh - 90px); overflow-y: auto;
}
.cover {
  text-align: center; padding: 50px 0 40px;
  border-bottom: 1px solid var(--border); margin-bottom: 40px;
}
.cover-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px; color: var(--accent);
  letter-spacing: 4px; margin-bottom: 18px;
}
.cover h1 { font-size: 38px; font-weight: 900; margin-bottom: 12px; letter-spacing: 4px; }
.cover .subtitle { font-size: 16px; color: var(--text-light); margin-bottom: 24px; }
.cover .author { font-family: 'Noto Sans SC', sans-serif; font-size: 14px; color: var(--text-light); }
.cover .author strong { color: var(--text); }
.chapter { margin-bottom: 60px; scroll-margin-top: 70px; }
.chapter-header {
  margin-bottom: 24px; padding-left: 14px;
  border-left: 4px solid var(--accent);
}
.chapter-num {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px; color: var(--accent);
  letter-spacing: 3px; margin-bottom: 6px;
}
.chapter-title { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.chapter-subtitle { font-size: 15px; color: var(--text-light); font-weight: 400; }
.chapter-content p {
  margin-bottom: 16px; text-indent: 2em;
  text-align: justify; transition: background 0.2s;
}
.chapter-content p.no-indent { text-indent: 0; }
.chapter-content .highlight {
  background: var(--highlight); padding: 1px 3px; border-radius: 2px;
}
.chapter-content .user-highlight {
  background: var(--highlight-active); padding: 1px 3px;
  border-radius: 2px; cursor: pointer;
}
.quote-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 22px 26px; margin: 24px 0;
  text-align: center; box-shadow: var(--shadow); position: relative;
}
.quote-card::before {
  content: '"'; position: absolute; top: -12px; left: 18px;
  font-size: 50px; color: var(--accent);
  font-family: Georgia, serif; line-height: 1;
}
.quote-card p { text-indent: 0; font-size: 17px; font-weight: 600; line-height: 1.8; margin-bottom: 0; }
.quote-card .source {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px; color: var(--text-light); margin-top: 10px;
}
.key-points {
  background: var(--accent-light); border-left: 3px solid var(--accent);
  padding: 14px 20px; margin: 20px 0; border-radius: 0 8px 8px 0;
}
.key-points p { text-indent: 0; margin-bottom: 6px; }
.key-points p:last-child { margin-bottom: 0; }
.key-points strong { color: var(--accent); }
.audio-panel {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.audio-panel-title {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px; font-weight: 600; color: var(--accent);
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.audio-panel-title::before {
  content: ''; display: inline-block; width: 7px; height: 7px;
  background: var(--accent); border-radius: 50%; animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.audio-player-wrap {
  background: var(--bg); border-radius: 8px; padding: 10px; margin-bottom: 10px;
}
.audio-player-wrap audio { width: 100%; height: 36px; }
.audio-player-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 11px; color: var(--text-light); margin-bottom: 6px;
}
.reading-tip {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px; color: var(--text-light); line-height: 1.8;
}
.reading-tip strong { color: var(--accent); display: block; margin-bottom: 6px; }
.reading-tip ul { padding-left: 16px; }
.reading-tip li { margin-bottom: 4px; }
.highlight-toolbar {
  position: absolute; background: var(--text); color: #fff;
  border-radius: 6px; padding: 6px 10px;
  font-family: 'Noto Sans SC', sans-serif; font-size: 12px;
  display: none; gap: 8px; z-index: 500; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.highlight-toolbar button {
  background: none; border: none; color: #fff;
  cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px;
}
.highlight-toolbar button:hover { background: rgba(255,255,255,0.2); }
.footer {
  text-align: center; padding: 30px 0;
  border-top: 1px solid var(--border); margin-top: 40px;
  font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: var(--text-light);
}
@media (max-width: 900px) {
  .main-layout { flex-direction: column; }
  .audio-sidebar { width: 100%; position: static; max-height: none; }
  .content-area { padding-right: 0; }
}
@media (max-width: 640px) {
  body { font-size: 15px; }
  .main-layout { padding: 20px 16px 50px; }
  .cover h1 { font-size: 28px; }
  .chapter-title { font-size: 20px; }
  .topbar { padding: 8px 16px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">{{BOOK_TITLE}} <span>· 带音频精读</span></div>
  <div class="topbar-actions">
    <button class="highlight-mode-btn" id="highlightBtn" onclick="toggleHighlightMode()">✦ 高亮模式</button>
    <button class="toc-btn" onclick="toggleToc()">目录</button>
  </div>
</div>

<div class="sidebar-overlay" id="overlay" onclick="toggleToc()"></div>
<div class="sidebar" id="sidebar">
  <h3>章 节 目 录</h3>
  {{TOC_ITEMS}}
</div>

<div class="highlight-toolbar" id="highlightToolbar">
  <button onclick="applyHighlight()">高亮</button>
  <button onclick="removeHighlight()">取消</button>
</div>

<div class="main-layout">
  <div class="content-area">
    <div class="cover">
      <div class="cover-label">{{COVER_LABEL}}</div>
      <h1>{{BOOK_TITLE}}</h1>
      <div class="subtitle">{{BOOK_SUBTITLE}}</div>
      <div class="author">
        <strong>{{AUTHOR}}</strong> 著<br>
        {{TRANSLATOR}}
      </div>
    </div>

    {{CHAPTERS_HTML}}

    <div class="footer">
      {{BOOK_TITLE}} · 带音频精读版<br>
      {{FOOTER_TEXT}}
    </div>
  </div>

  <div class="audio-sidebar">
    <div id="audioPanels"></div>
    <div class="reading-tip">
      <strong>使用说明</strong>
      <ul>
        <li>点击上方「✦ 高亮模式」开启高亮</li>
        <li>在文字上拖动选中句子，点击「高亮」标注</li>
        <li>点击已高亮文字可取消标注</li>
        <li>高亮自动保存，刷新不丢失</li>
        <li>右侧音频按章节自动连续播放</li>
      </ul>
    </div>
  </div>
</div>

<script>
// 章节音频数据 - 使用时替换为实际数据
const chapterAudios = {{AUDIO_DATA}};

const chapterNames = {{CHAPTER_NAMES}};

// 渲染右侧音频面板
function renderAudioPanels() {
  const container = document.getElementById('audioPanels');
  let html = '';
  for (const [chapterId, audios] of Object.entries(chapterAudios)) {
    if (audios.length === 0) continue;
    html += `<div class="audio-panel" id="panel-${chapterId}">
      <div class="audio-panel-title">${chapterNames[chapterId]} · 本章朗读</div>`;
    audios.forEach((audio, idx) => {
      html += `<div class="audio-player-wrap">
        <div class="audio-player-label">${audio.label}</div>
        <audio controls preload="none" data-chapter="${chapterId}" data-index="${idx}">
          <source src="${audio.url}" type="audio/wav">
        </audio>
      </div>`;
    });
    html += `</div>`;
  }
  container.innerHTML = html;

  document.querySelectorAll('audio').forEach(audio => {
    audio.addEventListener('ended', function() {
      const chapter = this.dataset.chapter;
      const idx = parseInt(this.dataset.index);
      const next = document.querySelector(`audio[data-chapter="${chapter}"][data-index="${idx+1}"]`);
      if (next) {
        next.play();
        next.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  });
}

function toggleToc() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
document.querySelectorAll('.sidebar a').forEach(a => {
  a.addEventListener('click', () => {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  });
});

let highlightMode = false;
function toggleHighlightMode() {
  highlightMode = !highlightMode;
  const btn = document.getElementById('highlightBtn');
  btn.classList.toggle('active', highlightMode);
  btn.textContent = highlightMode ? '✦ 高亮中' : '✦ 高亮模式';
  if (!highlightMode) {
    document.getElementById('highlightToolbar').style.display = 'none';
  }
}

const toolbar = document.getElementById('highlightToolbar');
let currentSelection = null;

document.addEventListener('mouseup', function(e) {
  if (!highlightMode) return;
  setTimeout(() => {
    const sel = window.getSelection();
    if (sel.toString().trim().length > 0) {
      const range = sel.getRangeAt(0);
      const rect = range.getBoundingClientRect();
      toolbar.style.display = 'flex';
      toolbar.style.left = (rect.left + window.scrollX) + 'px';
      toolbar.style.top = (rect.top + window.scrollY - 40) + 'px';
      currentSelection = sel;
    } else {
      toolbar.style.display = 'none';
    }
  }, 10);
});

function applyHighlight() {
  if (!currentSelection) return;
  const range = currentSelection.getRangeAt(0);
  const text = range.toString();
  if (text.trim().length === 0) return;
  const span = document.createElement('span');
  span.className = 'user-highlight';
  span.textContent = text;
  span.onclick = function(e) {
    if (highlightMode && confirm('取消此高亮？')) {
      const parent = this.parentNode;
      parent.replaceChild(document.createTextNode(this.textContent), this);
      parent.normalize();
      saveHighlights();
    }
  };
  try {
    range.deleteContents();
    range.insertNode(span);
    saveHighlights();
  } catch(e) { console.error('高亮失败', e); }
  toolbar.style.display = 'none';
  window.getSelection().removeAllRanges();
}

function removeHighlight() {
  toolbar.style.display = 'none';
  window.getSelection().removeAllRanges();
}

function saveHighlights() {
  const highlights = [];
  document.querySelectorAll('.user-highlight').forEach((el, idx) => {
    highlights.push({ text: el.textContent, id: 'hl-' + Date.now() + '-' + idx });
  });
  localStorage.setItem('audiobook_highlights_{{STORAGE_KEY}}', JSON.stringify(highlights));
}

function loadHighlights() {
  const saved = localStorage.getItem('audiobook_highlights_{{STORAGE_KEY}}');
  if (!saved) return;
}

const chapters = document.querySelectorAll('.chapter');
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const id = entry.target.id;
      document.querySelectorAll('.audio-panel').forEach(p => p.style.opacity = '0.5');
      const panel = document.getElementById('panel-' + id);
      if (panel) panel.style.opacity = '1';
    }
  });
}, { threshold: 0.3 });

document.addEventListener('DOMContentLoaded', function() {
  renderAudioPanels();
  loadHighlights();
  chapters.forEach(c => observer.observe(c));
});
</script>
</body>
</html>
